# =============================================================================
# Portfolio reconstruction pipeline – configuration
# =============================================================================
# Copy this file to `pipeline_config.yaml` (kept out of git) and fill in the
# values for your environment. Then run:
#
#     python run_pipeline.py --config pipeline_config.yaml
#
# Resume from a specific step after a failure:
#
#     python run_pipeline.py --config pipeline_config.yaml --from-step 1_2
#
# All paths may be absolute or relative to `output_root`.
# =============================================================================


# ----- Credentials ---------------------------------------------------------
# CoinGecko Pro API key (used by 0_0, 1_0, 1_2, 1_3).
coingecko_api_key: "CG-xxxxxxxxxxxxxxxxxxxxxxxx"

# Ethereum JSON-RPC HTTP endpoint (used by 0_4, 3_0, 4_0).
# Examples:
#   https://mainnet.infura.io/v3/<key>
#   https://eth-mainnet.g.alchemy.com/v2/<key>
rpc_url: "https://mainnet.infura.io/v3/REPLACE_WITH_YOUR_KEY"


# ----- Python interpreter --------------------------------------------------
# Path to the python executable that has all pipeline dependencies installed.
# Defaults to whichever `python` is on $PATH.
python_executable: "python"


# ----- Output root ---------------------------------------------------------
# Every relative path below is resolved against this folder.
# Created automatically if it doesn't exist.
output_root: "./data"


# ----- Stage 0 outputs -----------------------------------------------------
# Filenames CoinGecko/scanner/proxy stages produce.
all_coins_csv: "all_coins_coingecko.csv.gz"
derived_coingecko_eth_tokens_csv: "derived_coingecko_eth_tokens.csv"
erc20_proxy_resolved_tsv: "erc20_tokens_proxy_resolved.tsv"

# The status CSV is rewritten by every stage that touches it. We keep a
# versioned copy per stage and pass the latest one to the next step.
status_eth_tokens_csv_0_3: "status_eth_tokens_0_3.csv"
status_eth_tokens_csv_0_5: "status_eth_tokens_0_5.csv"
status_eth_tokens_csv_1_1: "status_eth_tokens_1_1.csv"
status_eth_tokens_csv_1_2: "status_eth_tokens_1_2.csv"
status_eth_tokens_csv_1_4: "status_eth_tokens_1_4.csv"
status_eth_tokens_csv_3_1: "status_eth_tokens_3_1.csv"


# ----- Stage 1 outputs (price + supply) ------------------------------------
prices_dir: "prices"                           # per-token <addr>_price.csv
prices_download_status_csv: "prices_download_status.csv"
tokens_cg_metrics_csv: "tokens_cg_metrics.csv"


# ----- Heavy on-chain inputs you must supply -------------------------------
# These are not generated by any script in this repo; you must provide them.

# 0_2: Delta Lake of Ethereum traces (must contain _delta_log/ at the root).
traces_dir: "/absolute/path/to/ethereum_traces_delta"

# 0_2 output: TSV of (contract_address \t creation_block).
contract_addresses_tsv: "contract_addresses.tsv"

# 0_2: Pin the Delta table to a specific commit version. Leave null to use
# the latest snapshot. Set this when `_delta_log/` has gaps above the latest
# checkpoint (deltalake then errors with "non-contiguous log segment");
# pick the highest contiguous version available in `_delta_log/`.
traces_delta_version: null

# 2_0: directory with raw log shards (Parquet) for the Transfer/Deposit/Withdrawal events.
raw_logs_dir: "/absolute/path/to/ethereum_logs"

# 2_0 intermediate map output (large, can live on scratch / tmpfs).
transfers_map_dir: "/absolute/path/to/scratch/transfers_map"

# 2_0 reduce output: per-token shard parquets.
transfers_final_dir: "/absolute/path/to/transfers_final"

# 2_1 output: per-token sorted ledgers used by 3_0 and 4_0.
ledgers_dir: "/absolute/path/to/ledgers"

# 3_0 output: validation_status.tsv is written inside ledgers_dir by default.
validation_status_tsv: "validation_status.tsv"


# ----- Stage 4/5 inputs you must supply ------------------------------------
# Block-to-date map (CSV; columns: block_number/block + date/bound_date/block_time_utc).
block_to_date_csv: "/absolute/path/to/blocks_closest_to_midnight.csv"

# JSON cache of token decimals (will be filled in if missing).
decimals_cache_json: "/absolute/path/to/token_decimals_cache.json"

# Parquet with the wallet addresses to reconstruct portfolios for.
input_wallets_parquet: "/absolute/path/to/wallets.parquet"
input_wallets_column: "address"


# ----- Stage 4/5 outputs ---------------------------------------------------
portfolio_holdings_parquet: "portfolio_holdings.parquet"
backtest_summary_csv: "backtest_summary.csv"
backtest_wallet_parquet: "backtest_wallet_metrics.parquet"


# ----- Tunables (defaults are fine for most users) -------------------------
# Want to forward a script-specific CLI flag that isn't listed below?
# See "Extending the config" in README.md and the comment block above the
# step builders in run_pipeline.py — adding a new knob is a 3-step change
# (add YAML key + wire it into the matching `_b_<step_id>` builder).

vs_currency: "usd"
volume_lookback_days: 10

# 2_0 map-reduce
mapreduce_batch: 48
mapreduce_timeout_seconds: 3600

# 3_0 validation
validation_trials: 200
validation_delay_seconds: 30
validation_delay_every: 10

# 4_0 reconstruction
reconstruction_batch_size: 50000
reconstruction_processes: null   # null -> auto (cpu_count - 1)
reconstruction_duckdb_threads: 2
reconstruction_duckdb_mem: "2GB"

# 5_0 backtest
backtest_horizon_days: 20
backtest_workers: null           # null -> use script default
backtest_blocks: null            # null -> AUTO; otherwise comma-separated or a file path
